<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentFloat — Web 控制台</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-dot">A</div>
      <div class="brand-text">
        <div class="brand-name">AgentFloat</div>
        <div class="brand-ver" id="verText">v…</div>
      </div>
    </div>
    <nav class="nav" id="nav">
      <a data-page="settings" class="nav-item active"><span class="nav-ico">⚙</span>设置</a>
      <a data-page="api" class="nav-item"><span class="nav-ico">¥</span>API 用量</a>
      <a data-page="news" class="nav-item"><span class="nav-ico">N</span>AI 快报</a>
    </nav>
    <div class="sidebar-foot">
      <button class="ghost-btn" id="btnTheme" title="切换浅色 / 深色主题">◐ 主题</button>
      <div class="status-line" id="statusLine">● 本地服务运行中</div>
    </div>
  </aside>

  <main class="main" id="main">
    <header class="topbar">
      <div class="page-title" id="pageTitle">设置</div>
      <div class="topbar-right">
        <span class="dirty-hint" id="dirtyHint">有未保存的修改</span>
        <button class="save-btn" id="btnSave" disabled>保存</button>
      </div>
    </header>

    <!-- 设置 -->
    <section class="page" id="page-settings">
      <div class="subnav" id="settingsSubnav">
        <button data-sub="general" class="sub active">通用</button>
        <button data-sub="agents" class="sub">Agent 管理</button>
        <button data-sub="radial" class="sub">环绕菜单</button>
        <button data-sub="skills" class="sub">Skills</button>
        <button data-sub="water" class="sub">喝水助手</button>
        <button data-sub="about" class="sub">关于</button>
      </div>
      <div class="content" id="settingsContent"></div>
    </section>

    <!-- API 用量 -->
    <section class="page hidden" id="page-api">
      <div class="content wide" id="apiContent"></div>
    </section>

    <!-- AI 快报 -->
    <section class="page hidden" id="page-news">
      <div class="content wide" id="newsContent"></div>
    </section>
  </main>
</div>

<div class="modal-mask hidden" id="modalMask">
  <div class="modal" id="modalBox"></div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
